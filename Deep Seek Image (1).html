<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0d0d0d;
    color: #e4e4e7;
    height: 100vh;
    overflow: hidden;
  }

  .header {
    padding: 16px 24px;
    border-bottom: 1px solid #1e1e1e;
    display: flex;
    align-items: center;
  }

  .logo {
    width: 32px;
    height: 32px;
  }

  .app {
    max-width: 800px;
    margin: 0 auto;
    height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    padding: 40px 20px;
  }

  .welcome {
    text-align: center;
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .welcome-logo {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
  }

  .welcome h1 {
    font-size: 28px;
    font-weight: 600;
    color: #e4e4e7;
    margin-bottom: 8px;
  }

  .welcome p {
    font-size: 16px;
    color: #71717a;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb {
    background: rgba(59, 130, 246, 0.3);
    border-radius: 3px;
  }

  .message {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }

  .avatar.ai {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
  }

  .avatar.user {
    background: #27272a;
    color: #a1a1aa;
  }

  .bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
  }

  .message.ai .bubble {
    background: #18181b;
    color: #e4e4e7;
    border: 1px solid #27272a;
    border-bottom-left-radius: 4px;
  }

  .message.user .bubble {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
  }

  .image-container {
    margin-top: 12px;
    border-radius: 12px;
    overflow: hidden;
    max-width: 100%;
    border: 1px solid #27272a;
    position: relative;
    background: #18181b;
  }

  .image-container img {
    width: 100%;
    height: auto;
    display: block;
  }

  .image-placeholder {
    width: 100%;
    height: 300px;
    background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #a1a1aa;
    border: 2px dashed #3f3f46;
  }

  .image-placeholder svg {
    width: 64px;
    height: 64px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .image-placeholder.success {
    background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
    border-color: #10b981;
    color: #34d399;
  }

  .progress-container {
    margin-top: 12px;
    padding: 16px;
    background: #0d0d0d;
    border-radius: 12px;
    border: 1px solid #27272a;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
    color: #a1a1aa;
  }

  .progress-percent {
    font-weight: 600;
    color: #60a5fa;
    font-family: 'Courier New', monospace;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: #27272a;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    border-radius: 2px;
    transition: width 0.1s linear;
    box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
  }

  .input-area {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 24px;
    padding: 16px 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s;
  }

  .input-area:focus-within {
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
  }

  .input-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #userInput {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: #e4e4e7;
    font-family: inherit;
    resize: none;
    min-height: 24px;
    max-height: 120px;
  }

  #userInput::placeholder {
    color: #52525b;
  }

  .actions {
    display: flex;
    gap: 8px;
  }

  .action-btn {
    padding: 6px 12px;
    border: 1px solid #27272a;
    background: #0d0d0d;
    border-radius: 16px;
    font-size: 13px;
    color: #60a5fa;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    font-weight: 500;
  }

  .action-btn:hover {
    background: #1e1e1e;
    border-color: #3f3f46;
  }

  .action-btn.active {
    background: rgba(59, 130, 246, 0.15);
    border-color: #3b82f6;
  }

  .right-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #71717a;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    background: #27272a;
    color: #e4e4e7;
  }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .send-btn:hover:not(:disabled) {
    background: #2563eb;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .request-counter {
    position: fixed;
    top: 16px;
    right: 24px;
    padding: 8px 16px;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 20px;
    font-size: 13px;
    color: #a1a1aa;
    font-weight: 500;
  }

  .request-counter span {
    color: #60a5fa;
    font-weight: 600;
  }

  .badge {
    display: inline-block;
    padding: 4px 8px;
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .badge.real {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
  }

  .error-message {
    margin-top: 12px;
    padding: 12px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 8px;
    color: #fca5a5;
    font-size: 14px;
  }

  .error-message strong {
    color: #f87171;
  }

  .download-link {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 16px;
    background: rgba(59, 130, 246, 0.2);
    border: 1px solid #3b82f6;
    border-radius: 8px;
    color: #60a5fa;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s;
  }

  .download-link:hover {
    background: rgba(59, 130, 246, 0.3);
  }
</style>
</head>
<body>

<div class="header">
  <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 2C8.268 2 2 8.268 2 16s6.268 14 14 14 14-6.268 14-14S23.732 2 16 2zm0 26C9.373 28 4 22.627 4 16S9.373 4 16 4s12 5.373 12 12-5.373 12-12 12z" fill="#3b82f6"/>
    <path d="M16 8c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 14c-3.314 0-6-2.686-6-6s2.686-6 6-6 6 2.686 6 6-2.686 6-6 6z" fill="#3b82f6"/>
    <circle cx="18" cy="14" r="2" fill="#3b82f6"/>
  </svg>
</div>

<div class="app">
  <div class="welcome" id="welcome">
    <svg class="welcome-logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4C12.954 4 4 12.954 4 24s8.954 20 20 20 20-8.954 20-20S35.046 4 24 4zm0 36c-8.837 0-16-7.163-16-16S15.163 8 24 8s16 7.163 16 16-7.163 16-16 16z" fill="#3b82f6"/>
      <path d="M24 12c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm0 22c-5.523 0-10-4.477-10-10s4.477-10 10-10 10 4.477 10 10-4.477 10-10 10z" fill="#3b82f6"/>
      <circle cx="27" cy="20" r="3" fill="#3b82f6"/>
    </svg>
    <h1>Hi! What's on your mind today?</h1>
    <p>Ask me anything or request an image generation</p>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="userInput" placeholder="Message DeepSeek" rows="1"></textarea>
      <div class="actions">
        <button class="action-btn" id="deepThinkBtn" onclick="toggleMode('deepThink')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10H12V2z"/>
            <path d="M12 2a10 10 0 0 1 10 10h-10V2z" opacity="0.5"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          DeepThink
        </button>
        <button class="action-btn" id="searchBtn" onclick="toggleMode('search')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Search
        </button>
      </div>
    </div>
    <div class="right-actions">
      <button class="icon-btn" title="Attach">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="request-counter">
  Request: <span id="counter">1</span>/3
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const welcome = document.getElementById('welcome');
  const counterEl = document.getElementById('counter');
  
  let requestCount = 1;
  let isGenerating = false;
  let activeMode = null;

  // Красивые тематические картинки с Unsplash (прямые CDN ссылки)
  const demoImages = {
    default: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1024&h=576&fit=crop',
    nature: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1024&h=576&fit=crop',
    tech: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=1024&h=576&fit=crop',
    space: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1024&h=576&fit=crop',
    art: 'https://images.unsplash.com/photo-1541963463532-d68292c34b19?w=1024&h=576&fit=crop',
    city: 'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1024&h=576&fit=crop',
    abstract: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=1024&h=576&fit=crop'
  };

  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  function toggleMode(mode) {
    activeMode = activeMode === mode ? null : mode;
    document.getElementById('deepThinkBtn').classList.toggle('active', activeMode === 'deepThink');
    document.getElementById('searchBtn').classList.toggle('active', activeMode === 'search');
  }

  function addMessage(text, sender, html = false) {
    const msg = document.createElement('div');
    msg.className = `message ${sender}`;
    
    const avatar = document.createElement('div');
    avatar.className = `avatar ${sender}`;
    avatar.textContent = sender === 'ai' ? '' : 'You';
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (html) {
      bubble.innerHTML = text;
    } else {
      bubble.textContent = text;
    }
    
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    
    return bubble;
  }

  function getImageCategory(prompt) {
    const p = prompt.toLowerCase();
    if (p.includes('nature') || p.includes('forest') || p.includes('mountain') || p.includes('tree')) return 'nature';
    if (p.includes('tech') || p.includes('computer') || p.includes('code') || p.includes('ai')) return 'tech';
    if (p.includes('space') || p.includes('galaxy') || p.includes('star') || p.includes('cosmos')) return 'space';
    if (p.includes('art') || p.includes('paint') || p.includes('draw')) return 'art';
    if (p.includes('city') || p.includes('urban') || p.includes('building')) return 'city';
    if (p.includes('abstract') || p.includes('color') || p.includes('pattern')) return 'abstract';
    return 'default';
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isGenerating) return;

    if (welcome) welcome.style.display = 'none';
    
    addMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    isGenerating = true;
    sendBtn.disabled = true;
    
    counterEl.textContent = requestCount;
    
    if (requestCount % 3 === 0) {
      await generateRealImage(text);
    } else {
      await simulateGeneration(text);
    }
    
    requestCount++;
    isGenerating = false;
    sendBtn.disabled = false;
  }

  function simulateGeneration(prompt) {
    return new Promise((resolve) => {
      setTimeout(() => {
        const bubble = addMessage(
          `<div class="badge">Generating</div>
           <div>I'm creating your image: "${prompt}"</div>
           <div class="progress-container">
             <div class="progress-header">
               <span>Generating image...</span>
               <span class="progress-percent">0%</span>
             </div>
             <div class="progress-bar">
               <div class="progress-fill" style="width: 0%"></div>
             </div>
           </div>`,
          'ai',
          true
        );
        
        const fill = bubble.querySelector('.progress-fill');
        const percentText = bubble.querySelector('.progress-percent');
        
        const duration = 60000;
        const startTime = Date.now();
        
        const timer = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(Math.floor((elapsed / duration) * 100), 100);
          
          fill.style.width = progress + '%';
          percentText.textContent = progress + '%';
          
          if (progress >= 100) {
            clearInterval(timer);
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = '<strong>Network Error</strong><br><span style="font-size: 12px; opacity: 0.8;">Failed to connect to generation server. Please try again.</span>';
            bubble.appendChild(errorDiv);
            chat.scrollTop = chat.scrollHeight;
            resolve();
          }
        }, 100);
      }, 500);
    });
  }

  async function generateRealImage(prompt) {
    const bubble = addMessage(
      `<div class="badge real">Real Generation</div>
       <div>Generating image: "${prompt}"</div>
       <div class="progress-container">
         <div class="progress-header">
           <span>Downloading from AI...</span>
           <span class="progress-percent">0%</span>
         </div>
         <div class="progress-bar">
           <div class="progress-fill" style="width: 0%"></div>
         </div>
       </div>`,
      'ai',
      true
    );
    
    const fill = bubble.querySelector('.progress-fill');
    const percentText = bubble.querySelector('.progress-percent');
    
    // Определяем категорию и выбираем картинку
    const category = getImageCategory(prompt);
    const imageUrl = demoImages[category] || demoImages.default;
    
    // Анимация прогресса
    const duration = 3000;
    const startTime = Date.now();
    
    const timer = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(Math.floor((elapsed / duration) * 100), 100);
      
      fill.style.width = progress + '%';
      percentText.textContent = progress + '%';
      
      if (progress >= 100) {
        clearInterval(timer);
        
        // Показываем картинку
        const imgContainer = document.createElement('div');
        imgContainer.className = 'image-container';
        
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = prompt;
        img.style.display = 'none';
        
        img.onload = () => {
          imgContainer.innerHTML = '';
          imgContainer.appendChild(img);
          img.style.display = 'block';
          
          const progressContainer = bubble.querySelector('.progress-container');
          if (progressContainer) {
            progressContainer.style.display = 'none';
          }
          
          // Добавляем ссылку для скачивания
          const link = document.createElement('a');
          link.href = imageUrl;
          link.target = '_blank';
          link.className = 'download-link';
          link.innerHTML = ' Open full size';
          imgContainer.appendChild(link);
          
          chat.scrollTop = chat.scrollHeight;
        };
        
        img.onerror = () => {
          // Fallback на placeholder
          imgContainer.innerHTML = `
            <div class="image-placeholder success">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <div>Image generated successfully!</div>
              <div style="font-size: 12px; margin-top: 8px; opacity: 0.8;">"${prompt}"</div>
            </div>
          `;
        };
        
        imgContainer.appendChild(img);
        bubble.appendChild(imgContainer);
        chat.scrollTop = chat.scrollHeight;
      }
    }, 100);
  }
</script>

</body>
</html>
