<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0d0d0d;
    color: #e4e4e7;
    height: 100vh;
    overflow: hidden;
  }

  .header {
    padding: 16px 24px;
    border-bottom: 1px solid #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    width: 32px;
    height: 32px;
  }

  .mode-switcher {
    display: flex;
    gap: 8px;
    background: #18181b;
    padding: 4px;
    border-radius: 12px;
    border: 1px solid #27272a;
  }

  .mode-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 14px;
    color: #a1a1aa;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .mode-btn:hover {
    color: #e4e4e7;
  }

  .mode-btn.active {
    background: #3b82f6;
    color: white;
  }

  .app {
    max-width: 800px;
    margin: 0 auto;
    height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    padding: 40px 20px;
  }

  .welcome {
    text-align: center;
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .welcome-logo {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
  }

  .welcome h1 {
    font-size: 28px;
    font-weight: 600;
    color: #e4e4e7;
    margin-bottom: 8px;
  }

  .welcome p {
    font-size: 16px;
    color: #71717a;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb {
    background: rgba(59, 130, 246, 0.3);
    border-radius: 3px;
  }

  .message {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }

  .avatar.ai {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
  }

  .avatar.user {
    background: #27272a;
    color: #a1a1aa;
  }

  .bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
  }

  .message.ai .bubble {
    background: #18181b;
    color: #e4e4e7;
    border: 1px solid #27272a;
    border-bottom-left-radius: 4px;
  }

  .message.user .bubble {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
  }

  .image-container {
    margin-top: 12px;
    border-radius: 12px;
    overflow: hidden;
    max-width: 100%;
    border: 1px solid #27272a;
    position: relative;
    background: #18181b;
    min-height: 300px;
  }

  .image-container img,
  .image-container video {
    width: 100%;
    height: auto;
    display: block;
  }

  .image-loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #a1a1aa;
    font-size: 14px;
    width: 100%;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #27272a;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .progress-container {
    margin-top: 12px;
    padding: 16px;
    background: #0d0d0d;
    border-radius: 12px;
    border: 1px solid #27272a;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
    color: #a1a1aa;
  }

  .progress-percent {
    font-weight: 600;
    color: #60a5fa;
    font-family: 'Courier New', monospace;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: #27272a;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    border-radius: 2px;
    transition: width 0.1s linear;
    box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
  }

  .input-area {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 24px;
    padding: 16px 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s;
  }

  .input-area:focus-within {
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
  }

  .input-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #userInput {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: #e4e4e7;
    font-family: inherit;
    resize: none;
    min-height: 24px;
    max-height: 120px;
  }

  #userInput::placeholder {
    color: #52525b;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 6px 12px;
    border: 1px solid #27272a;
    background: #0d0d0d;
    border-radius: 16px;
    font-size: 13px;
    color: #60a5fa;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    font-weight: 500;
  }

  .action-btn:hover {
    background: #1e1e1e;
    border-color: #3f3f46;
  }

  .action-btn.active {
    background: rgba(59, 130, 246, 0.15);
    border-color: #3b82f6;
  }

  .style-selector {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .style-btn {
    padding: 4px 10px;
    border: 1px solid #27272a;
    background: #0d0d0d;
    border-radius: 12px;
    font-size: 11px;
    color: #a1a1aa;
    cursor: pointer;
    transition: all 0.2s;
  }

  .style-btn:hover {
    background: #1e1e1e;
    color: #e4e4e7;
  }

  .style-btn.active {
    background: rgba(139, 92, 246, 0.15);
    border-color: #8b5cf6;
    color: #a78bfa;
  }

  .right-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #71717a;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    background: #27272a;
    color: #e4e4e7;
  }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .send-btn:hover:not(:disabled) {
    background: #2563eb;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .badge {
    display: inline-block;
    padding: 4px 8px;
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .badge.chat {
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
  }

  .badge.video {
    background: rgba(236, 72, 153, 0.15);
    color: #f472b6;
  }

  .download-link {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 16px;
    background: rgba(59, 130, 246, 0.2);
    border: 1px solid #3b82f6;
    border-radius: 8px;
    color: #60a5fa;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s;
  }

  .download-link:hover {
    background: rgba(59, 130, 246, 0.3);
  }

  .error-message {
    margin-top: 12px;
    padding: 12px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 8px;
    color: #fca5a5;
    font-size: 14px;
  }

  .error-message strong {
    color: #f87171;
  }

  .prompt-preview {
    margin-top: 8px;
    padding: 8px;
    background: rgba(139, 92, 246, 0.1);
    border-left: 3px solid #8b5cf6;
    border-radius: 4px;
    font-size: 12px;
    color: #a78bfa;
    font-style: italic;
  }

  .retry-btn {
    margin-top: 8px;
    padding: 6px 12px;
    background: rgba(59, 130, 246, 0.2);
    border: 1px solid #3b82f6;
    border-radius: 6px;
    color: #60a5fa;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .retry-btn:hover {
    background: rgba(59, 130, 246, 0.3);
  }

  .typing-dots {
    display: inline-flex;
    gap: 4px;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: #3b82f6;
    border-radius: 50%;
    animation: typing 1.4s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
</style>
</head>
<body>

<div class="header">
  <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 2C8.268 2 2 8.268 2 16s6.268 14 14 14 14-6.268 14-14S23.732 2 16 2zm0 26C9.373 28 4 22.627 4 16S9.373 4 16 4s12 5.373 12 12-5.373 12-12 12z" fill="#3b82f6"/>
    <path d="M16 8c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 14c-3.314 0-6-2.686-6-6s2.686-6 6-6 6 2.686 6 6-2.686 6-6 6z" fill="#3b82f6"/>
    <circle cx="18" cy="14" r="2" fill="#3b82f6"/>
  </svg>
  
  <div class="mode-switcher">
    <button class="mode-btn active" onclick="switchMode('chat')">💬 Chat</button>
    <button class="mode-btn" onclick="switchMode('image')">🎨 Image</button>
    <button class="mode-btn" onclick="switchMode('video')"> Video</button>
  </div>
</div>

<div class="app">
  <div class="welcome" id="welcome">
    <svg class="welcome-logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4C12.954 4 4 12.954 4 24s8.954 20 20 20 20-8.954 20-20S35.046 4 24 4zm0 36c-8.837 0-16-7.163-16-16S15.163 8 24 8s16 7.163 16 16-7.163 16-16 16z" fill="#3b82f6"/>
      <path d="M24 12c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm0 22c-5.523 0-10-4.477-10-10s4.477-10 10-10 10 4.477 10 10-4.477 10-10 10z" fill="#3b82f6"/>
      <circle cx="27" cy="20" r="3" fill="#3b82f6"/>
    </svg>
    <h1 id="welcomeTitle">Hi! What's on your mind today?</h1>
    <p id="welcomeText">Ask me anything or switch modes to generate images and videos</p>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="userInput" placeholder="Message DeepSeek" rows="1"></textarea>
      <div class="style-selector" id="styleSelector" style="display: none;">
        <button class="style-btn active" data-style="realistic">Realistic</button>
        <button class="style-btn" data-style="digital">Digital Art</button>
        <button class="style-btn" data-style="artistic">Artistic</button>
        <button class="style-btn" data-style="photo">Photo</button>
        <button class="style-btn" data-style="anime">Anime</button>
      </div>
      <div class="actions">
        <button class="action-btn" id="deepThinkBtn" onclick="toggleMode('deepThink')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10H12V2z"/>
            <path d="M12 2a10 10 0 0 1 10 10h-10V2z" opacity="0.5"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          DeepThink
        </button>
        <button class="action-btn" id="searchBtn" onclick="toggleMode('search')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Search
        </button>
      </div>
    </div>
    <div class="right-actions">
      <button class="icon-btn" title="Attach">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const welcome = document.getElementById('welcome');
  const welcomeTitle = document.getElementById('welcomeTitle');
  const welcomeText = document.getElementById('welcomeText');
  const styleSelector = document.getElementById('styleSelector');
  
  let currentMode = 'chat';
  let isGenerating = false;
  let activeMode = null;
  let selectedStyle = 'realistic';
  let chatHistory = [];

  const stylePrompts = {
    realistic: 'photorealistic, highly detailed, professional photography, 8k, ultra HD, sharp focus, natural lighting',
    anime: 'anime style, manga art, vibrant colors, detailed illustration, studio ghibli quality, clean lines',
    artistic: 'artistic painting, oil painting style, creative composition, rich colors, masterpiece, gallery quality',
    digital: 'digital art, concept art, trending on artstation, highly detailed, professional digital illustration',
    photo: 'professional photograph, DSLR quality, natural lighting, shallow depth of field, bokeh, 35mm lens'
  };

  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedStyle = btn.dataset.style;
    });
  });

  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    if (mode === 'chat') {
      welcomeTitle.textContent = 'Hi! What\'s on your mind today?';
      welcomeText.textContent = 'Ask me anything - I\'m here to help with questions and conversations';
      styleSelector.style.display = 'none';
      input.placeholder = 'Message DeepSeek';
    } else if (mode === 'image') {
      welcomeTitle.textContent = 'Generate Amazing Images';
      welcomeText.textContent = 'Describe what you want to see and I\'ll create it for you';
      styleSelector.style.display = 'flex';
      input.placeholder = 'Describe the image you want to generate...';
    } else {
      welcomeTitle.textContent = 'Create AI Videos';
      welcomeText.textContent = 'Describe a scene and I\'ll generate a short video clip';
      styleSelector.style.display = 'none';
      input.placeholder = 'Describe the video scene you want to create...';
    }
  }

  function toggleMode(mode) {
    activeMode = activeMode === mode ? null : mode;
    document.getElementById('deepThinkBtn').classList.toggle('active', activeMode === 'deepThink');
    document.getElementById('searchBtn').classList.toggle('active', activeMode === 'search');
  }

  function addMessage(text, sender, html = false) {
    const msg = document.createElement('div');
    msg.className = `message ${sender}`;
    
    const avatar = document.createElement('div');
    avatar.className = `avatar ${sender}`;
    avatar.textContent = sender === 'ai' ? '' : 'You';
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (html) {
      bubble.innerHTML = text;
    } else {
      bubble.textContent = text;
    }
    
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    
    return bubble;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isGenerating) return;

    if (welcome) welcome.style.display = 'none';
    
    addMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    isGenerating = true;
    sendBtn.disabled = true;
    
    if (currentMode === 'chat') {
      await chatWithAI(text);
    } else if (currentMode === 'image') {
      await generateRealImage(text, selectedStyle);
    } else {
      await generateVideo(text);
    }
    
    isGenerating = false;
    sendBtn.disabled = false;
  }

  async function chatWithAI(message) {
    const bubble = addMessage(
      `<div class="badge chat">AI Chat</div>
       <div class="typing-dots">
         <span></span>
         <span></span>
         <span></span>
       </div>`,
      'ai',
      true
    );
    
    try {
      // Используем Pollinations OpenAI-compatible API
      const response = await fetch('https://text.pollinations.ai/openai', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: 'mistral',
          messages: [
            { role: 'system', content: 'You are a helpful AI assistant. Answer questions clearly and concisely.' },
            ...chatHistory,
            { role: 'user', content: message }
          ],
          temperature: 0.7,
          max_tokens: 1000
        })
      });
      
      if (!response.ok) throw new Error('API error');
      
      const data = await response.json();
      const text = data.choices[0].message.content;
      
      // Сохраняем историю
      chatHistory.push({ role: 'user', content: message });
      chatHistory.push({ role: 'assistant', content: text });
      
      // Ограничиваем историю
      if (chatHistory.length > 10) {
        chatHistory = chatHistory.slice(-10);
      }
      
      bubble.innerHTML = `<div class="badge chat">AI Chat</div><div>${text}</div>`;
      
    } catch (error) {
      console.error('Chat error:', error);
      bubble.innerHTML = `<div class="badge chat">AI Chat</div>
        <div class="error-message">
          <strong>Failed to get response</strong><br>
          <span style="font-size: 12px; opacity: 0.8;">Please try again.</span>
        </div>`;
    }
  }

  async function generateRealImage(prompt, style) {
    const enhancedPrompt = `${prompt}, ${stylePrompts[style]}`;
    
    const bubble = addMessage(
      `<div class="badge">AI Generation</div>
       <div>Creating image: "${prompt}"</div>
       <div class="prompt-preview">Style: ${style}</div>
       <div class="progress-container">
         <div class="progress-header">
           <span>Generating with AI...</span>
           <span class="progress-percent">0%</span>
         </div>
         <div class="progress-bar">
           <div class="progress-fill" style="width: 0%"></div>
         </div>
       </div>`,
      'ai',
      true
    );
    
    const fill = bubble.querySelector('.progress-fill');
    const percentText = bubble.querySelector('.progress-percent');
    
    const width = 1024;
    const height = 1024;
    const seed = Math.floor(Math.random() * 1000000);
    
    const encodedPrompt = encodeURIComponent(enhancedPrompt);
    
    const imageUrls = [
      `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&model=flux-realism`,
      `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&model=flux`,
      `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&model=stable-diffusion-xl`,
      `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`
    ];
    
    const imgContainer = document.createElement('div');
    imgContainer.className = 'image-container';
    imgContainer.style.height = '400px';
    imgContainer.innerHTML = `
      <div class="image-loading">
        <div class="spinner"></div>
        <div>Generating image...</div>
        <div style="font-size: 12px; margin-top: 6px; opacity: 0.6;">This may take 10-30 seconds</div>
      </div>
    `;
    
    const img = document.createElement('img');
    img.style.display = 'none';
    img.alt = prompt;
    
    let currentUrlIndex = 0;
    
    const tryLoadImage = () => {
      if (currentUrlIndex >= imageUrls.length) {
        imgContainer.innerHTML = `
          <div class="error-message">
            <strong>Generation failed</strong><br>
            <span style="font-size: 12px; opacity: 0.8;">Could not generate image. Please try again.</span>
            <br>
            <button class="retry-btn" onclick="retryGeneration('${prompt.replace(/'/g, "\\'")}', '${style}')">Retry</button>
          </div>
        `;
        return;
      }
      
      img.src = imageUrls[currentUrlIndex];
      console.log('Trying URL:', imageUrls[currentUrlIndex]);
    };
    
    img.onload = () => {
      console.log('Image loaded successfully!');
      imgContainer.style.height = 'auto';
      imgContainer.innerHTML = '';
      imgContainer.appendChild(img);
      img.style.display = 'block';
      
      const progressContainer = bubble.querySelector('.progress-container');
      if (progressContainer) {
        progressContainer.style.display = 'none';
      }
      
      const link = document.createElement('a');
      link.href = img.src;
      link.target = '_blank';
      link.className = 'download-link';
      link.innerHTML = 'Open full size';
      imgContainer.appendChild(link);
      
      chat.scrollTop = chat.scrollHeight;
    };
    
    img.onerror = () => {
      console.log('Failed to load from:', imageUrls[currentUrlIndex]);
      currentUrlIndex++;
      tryLoadImage();
    };
    
    imgContainer.appendChild(img);
    bubble.appendChild(imgContainer);
    
    tryLoadImage();
    
    const duration = 30000;
    const startTime = Date.now();
    
    const timer = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(Math.floor((elapsed / duration) * 100), 100);
      
      fill.style.width = progress + '%';
      percentText.textContent = progress + '%';
      
      if (progress >= 100) {
        clearInterval(timer);
      }
    }, 100);
    
    chat.scrollTop = chat.scrollHeight;
  }

  async function generateVideo(prompt) {
    const bubble = addMessage(
      `<div class="badge video">AI Video</div>
       <div>Creating video: "${prompt}"</div>
       <div class="progress-container">
         <div class="progress-header">
           <span>Generating video...</span>
           <span class="progress-percent">0%</span>
         </div>
         <div class="progress-bar">
           <div class="progress-fill" style="width: 0%"></div>
         </div>
       </div>`,
      'ai',
      true
    );
    
    const fill = bubble.querySelector('.progress-fill');
    const percentText = bubble.querySelector('.progress-percent');
    
    const width = 512;
    const height = 512;
    const seed = Math.floor(Math.random() * 1000000);
    
    const encodedPrompt = encodeURIComponent(prompt);
    
    // Pollinations video generation (Wan model)
    const videoUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&model=wan&video=true`;
    
    const videoContainer = document.createElement('div');
    videoContainer.className = 'image-container';
    videoContainer.style.height = '400px';
    videoContainer.innerHTML = `
      <div class="image-loading">
        <div class="spinner"></div>
        <div>Generating video...</div>
        <div style="font-size: 12px; margin-top: 6px; opacity: 0.6;">This may take 30-60 seconds</div>
      </div>
    `;
    
    const video = document.createElement('video');
    video.style.display = 'none';
    video.controls = true;
    video.autoplay = true;
    video.loop = true;
    
    video.onloadeddata = () => {
      console.log('Video loaded successfully!');
      videoContainer.style.height = 'auto';
      videoContainer.innerHTML = '';
      videoContainer.appendChild(video);
      video.style.display = 'block';
      
      const progressContainer = bubble.querySelector('.progress-container');
      if (progressContainer) {
        progressContainer.style.display = 'none';
      }
      
      const link = document.createElement('a');
      link.href = videoUrl;
      link.target = '_blank';
      link.className = 'download-link';
      link.innerHTML = 'Download video';
      videoContainer.appendChild(link);
      
      chat.scrollTop = chat.scrollHeight;
    };
    
    video.onerror = () => {
      videoContainer.innerHTML = `
        <div class="error-message">
          <strong>Video generation failed</strong><br>
          <span style="font-size: 12px; opacity: 0.8;">Could not generate video. Please try again.</span>
          <br>
          <button class="retry-btn" onclick="retryVideoGeneration('${prompt.replace(/'/g, "\\'")}')">Retry</button>
        </div>
      `;
    };
    
    video.src = videoUrl;
    videoContainer.appendChild(video);
    bubble.appendChild(videoContainer);
    
    const duration = 60000; // 60 секунд для видео
    const startTime = Date.now();
    
    const timer = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(Math.floor((elapsed / duration) * 100), 100);
      
      fill.style.width = progress + '%';
      percentText.textContent = progress + '%';
      
      if (progress >= 100) {
        clearInterval(timer);
      }
    }, 100);
    
    chat.scrollTop = chat.scrollHeight;
  }

  function retryGeneration(prompt, style) {
    isGenerating = false;
    sendBtn.disabled = false;
    generateRealImage(prompt, style);
  }

  function retryVideoGeneration(prompt) {
    isGenerating = false;
    sendBtn.disabled = false;
    generateVideo(prompt);
  }
</script>
